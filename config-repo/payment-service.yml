server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/shopmart_payment?createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

payment:
  simulate-failure: false
  max-amount: 80000000
