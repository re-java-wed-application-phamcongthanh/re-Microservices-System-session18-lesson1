server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/shopmart_inventory?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  cache:
    type: redis
